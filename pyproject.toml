[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selfclaw"
version = "0.1.0"
description = "A learning version of PythonClaw."
requires-python = ">=3.10"

[project.scripts]
selfclaw = "selfclaw.main:main"

[tool.setuptools.packages.find]
include = ["selfclaw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]